name: Publish reading site

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/images/**'
      - 'downloads/**'
      - 'book.json'
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install only website dependencies
        run: python -m pip install --only-binary=:all: -r site/requirements.txt
      - name: Build and validate reading site
        run: python scripts/build_site.py --base-path "/${GITHUB_REPOSITORY#*/}/" --epub downloads/GPU-Modern-Computing.epub
      - name: Check browser script syntax
        run: node --check site/app.js
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
